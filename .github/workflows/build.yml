name: Build

# Every push and pull request: run the Nightscout unit tests and build a debug APK.
# Pushing a tag like v0.1.0: also build the release APK and publish a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        working-directory: core
        run: ../gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoAPS-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Signing secrets (Settings > Secrets and variables > Actions):
      #   SIGNING_KEYSTORE_BASE64  base64 of the .jks file
      #   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      # Without them the release falls back to a debug-signed APK, which installs fine
      # but can't be updated by a properly signed build later without uninstalling.
      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets set; publishing a debug-signed APK."
          fi

      - name: Build APK
        env:
          SIGNING_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$SIGNING_KEYSTORE" ]; then
            ./gradlew :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "AutoAPS-$VERSION.apk"
          else
            ./gradlew :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "AutoAPS-$VERSION.apk"
          fi
          sha256sum "AutoAPS-$VERSION.apk" > "AutoAPS-$VERSION.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AutoAPS-*.apk
            AutoAPS-*.apk.sha256
          # Tags with a suffix, like v0.1.0-beta.1, are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            **AutoAPS is not a medical device. Never make treatment decisions from it.** Read the [safety notice](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/DISCLAIMER.md) before installing.

            Install the APK on your phone, then follow the [install steps](https://github.com/${{ github.repository }}#install) to enable it in Android Auto.
